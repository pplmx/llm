site_name: LLM Framework Documentation
site_description: 模块化 PyTorch LLM 训练与推理框架 — 流式预训练、PEFT 微调、量化、导出与 OpenAI 兼容服务
site_url: https://pplmx.github.io/llm
repo_url: https://github.com/pplmx/llm
repo_name: pplmx/llm
edit_uri: edit/main/docs/

theme:
  name: material
  language: zh
  custom_dir: overrides
  icon:
    logo: material/book-open-page-variant
    repo: fontawesome/brands/github
    edit: material/pencil
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: 切换到深色模式
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: 切换到浅色模式
  features:
    - navigation.instant
    - navigation.tabs
    - navigation.sections
    - navigation.expand
    - navigation.indexes
    - navigation.top
    - navigation.footer
    - search.suggest
    - search.highlight
    - content.action.edit
    - content.code.copy
    - content.code.annotate
    - content.tabs.link

# 排除内部 / 归档文档，避免 "not in nav" 告警。
# 路径相对 docs/（不带 docs/ 前缀）。
exclude_docs: |
  audits/*
  superpowers/*
  agents/*
  adr/template.md

plugins:
  - search:
      lang: zh
  # mkdocstrings 从 Python docstring 自动生成 API Reference；
  # 页面在 docs/api/ 下，用 ```:: llm.something ``` 围栏块引用。
  - mkdocstrings:
      default_handler: python
      handlers:
        python:
          # 部分子包（如 llm.training）是 namespace 包，没有 __init__.py。
          # 下面的选项让 mkdocstrings 也能解析它们。
          new_path_syntax: true
          paths: [src]
          options:
            docstring_style: google
            show_source: true
            show_root_heading: true
            show_root_full_path: false
            members_order: source
            separate_signature: true
            show_symbol_type_heading: true
            show_symbol_type_toc: true
            filters: ["!^_"]
            inherited_members: false
  # 页面级标签（front matter `tags:`）+ 标签索引页（docs/tags.md）。
  - tags:
      tags: true

markdown_extensions:
  # ``toc`` 必须使用保留 Unicode 的 slugify：默认实现会剥掉 CJK 字符，
  # 导致所有中文标题锚点变成 ``_N``，站内中文锚点链接全部失效。
  - toc:
      permalink: true
      slugify: !!python/name:markdown.extensions.toc.slugify_unicode
  - admonition
  - pymdownx.details
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.tabbed:
      alternate_style: true
  - tables
  - attr_list
  - md_in_html

extra_css:
  - stylesheets/extra.css

