default_install_hook_types:
    - pre-commit
    - commit-msg

default_stages:
    - pre-commit

fail_fast: true

repos:
    - repo: builtin
      hooks:
          - id: end-of-file-fixer
          - id: trailing-whitespace
            exclude: \.md$
          - id: check-toml
          - id: check-yaml
          - id: check-merge-conflict
          - id: mixed-line-ending
            args: ["--fix=lf"]

    - repo: https://github.com/commitizen-tools/commitizen
      rev: v4.17.0
      hooks:
          - id: commitizen

    - repo: https://github.com/rvben/rumdl-pre-commit
      rev: v0.2.52
      hooks:
          # CHANGELOG entries are intentionally long single-paragraph
          # bullets (Keep a Changelog style) that cannot satisfy MD013;
          # docs/audits is archival (long single-line audit tables).
          - id: rumdl
            args: [--fix]
            exclude: (CHANGELOG\.md$|docs/audits/)
          - id: rumdl-fmt # Pure format, always exits 0
            exclude: (CHANGELOG\.md$|docs/audits/)

    - repo: https://github.com/astral-sh/ruff-pre-commit
      rev: v0.16.1
      hooks:
          - id: ruff-check
            args: [--fix]
          - id: ruff-format

    # Fail the commit if uv.lock is out of date with pyproject.toml. A stale
    # lock silently drifts deps (e.g. torch) on the next `uv run`; `--check`
    # refuses to regenerate, so the lock only changes via an explicit `uv lock`.
    - repo: https://github.com/astral-sh/uv-pre-commit
      rev: 0.9.30
      hooks:
          - id: uv-lock
            args: [--check]

    # Mirrors the CI `ty check src/llm/` gate, scoped by ty.toml (non-src dirs
    # are intentionally not type-clean, so `uv check` excludes them).
    - repo: https://github.com/astral-sh/ty-pre-commit
      rev: v0.0.86
      hooks:
          - id: ty

    # Mirror the remaining CI lint gates locally: doctests. These run on every
    # commit so a self-hosted CI runner is not needed to catch regressions.
    - repo: local
      hooks:
          - id: doctests
            name: doctests (src/llm)
            entry: uv run pytest --doctest-modules src/llm/ --no-header -q
            language: system
            pass_filenames: false
