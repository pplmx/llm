default_install_hook_types:
    - pre-commit
    - commit-msg

default_stages:
    - pre-commit

fail_fast: true

repos:
    - repo: builtin
      hooks:
          - id: end-of-file-fixer
          - id: trailing-whitespace
            exclude: \.md$
          - id: check-toml
          - id: check-yaml
          - id: check-merge-conflict
          - id: mixed-line-ending
            args: ["--fix=lf"]

    - repo: https://github.com/commitizen-tools/commitizen
      rev: v4.17.0
      hooks:
          - id: commitizen

    - repo: https://github.com/rvben/rumdl-pre-commit
      rev: v0.2.47
      hooks:
          # CHANGELOG entries are intentionally long single-paragraph
          # bullets (Keep a Changelog style) that cannot satisfy MD013.
          - id: rumdl
            args: [--fix]
            exclude: CHANGELOG\.md$
          - id: rumdl-fmt # Pure format, always exits 0
            exclude: CHANGELOG\.md$

    - repo: https://github.com/astral-sh/ruff-pre-commit
      rev: v0.16.1
      hooks:
          - id: ruff-check
            args: [--fix]
          - id: ruff-format
