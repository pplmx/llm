default_install_hook_types:
    - pre-commit
    - commit-msg

default_stages:
    - pre-commit

fail_fast: true

repos:
    - repo: builtin
      hooks:
          - id: end-of-file-fixer
          - id: trailing-whitespace
            exclude: \.md$
          - id: check-toml
          - id: check-yaml
          - id: check-merge-conflict
          - id: mixed-line-ending
            args: ["--fix=lf"]

    - repo: https://github.com/commitizen-tools/commitizen
      rev: v4.17.0
      hooks:
          - id: commitizen

    - repo: https://github.com/rvben/rumdl-pre-commit
      rev: v0.2.52
      hooks:
          # CHANGELOG entries are intentionally long single-paragraph
          # bullets (Keep a Changelog style) that cannot satisfy MD013;
          # docs/audits is archival (long single-line audit tables).
          - id: rumdl
            args: [--fix]
            exclude: (CHANGELOG\.md$|docs/audits/)
          - id: rumdl-fmt # Pure format, always exits 0
            exclude: (CHANGELOG\.md$|docs/audits/)

    - repo: https://github.com/astral-sh/ruff-pre-commit
      rev: v0.16.1
      hooks:
          - id: ruff-check
            args: [--fix]
          - id: ruff-format

    # Mirror the CI lint job gates locally: type check + doctests. These run
    # on every commit so a self-hosted CI runner is not needed to catch
    # regressions on the code paths they cover.
    - repo: local
      hooks:
          - id: ty
            name: ty (type check src/llm)
            entry: uvx ty check src/llm/
            language: system
            pass_filenames: false
          - id: doctests
            name: doctests (src/llm)
            entry: uv run pytest --doctest-modules src/llm/ --no-header -q
            language: system
            pass_filenames: false
