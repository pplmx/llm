name: Labeler

# Least privilege: the action only applies labels to issues and pull requests.
permissions:
    contents: read
    issues: write
    pull-requests: write

on:
    - pull_request
    - issues

jobs:
    labeler:
        runs-on: ubuntu-latest
        steps:
            -   uses: srvaroa/labeler@master
                with:
                    config_path: .github/configs/labeler.yml
                env:
                    GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
