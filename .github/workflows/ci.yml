name: CI # Continuous Integration

on:
    push:
        branches:
            - main
    pull_request:
    # Weekly schedule for dependency-vulnerability scanning (Tier-1 audit
    # item #09 / Finding X). The cron picks up newly-published CVEs that
    # land after the PR that introduced the dependency.
    schedule:
        -   cron: "0 6 * * 1"  # Mondays 06:00 UTC
    workflow_dispatch:

concurrency:
    group: ci-${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: true

jobs:
    lint:
        runs-on: ubuntu-latest
        steps:
            -   name: Checkout repository
                uses: actions/checkout@v7

            -   name: Set up UV Environment
                uses: astral-sh/setup-uv@v10.3.0
                with:
                    enable-cache: true
                    # setup-uv's default cache key glob is
                    # ``**/*requirements*.txt``; this repo has no such file, so
                    # the key was constant and the cache could never be
                    # invalidated by a dependency change (and a stale key
                    # silently reuses an unrelated tree). ``uv.lock`` is the
                    # actual dependency fingerprint here.
                    cache-dependency-glob: uv.lock

            -   name: Verify lockfile is up to date
                run: uv lock --check

            -   name: Resolve lint tool versions from the lock
                # The tools are pinned by uv.lock, not by the pyproject floors
                # (ruff floors at >=0.16.1 but the lock resolves 0.17.0), so
                # read the resolved versions to keep this gate byte-identical
                # to what `uv sync --group dev` would have produced.
                id: lint-tools
                run: |
                    RUFF=$(python3 -c "
                    import pathlib, re
                    text = pathlib.Path('uv.lock').read_text()
                    m = re.search(r'\[\[package\]\]\nname = \"ruff\"\nversion = \"([^\"]+)\"', text)
                    print(m.group(1) if m else '')
                    ")
                    TY=$(python3 -c "
                    import pathlib, re
                    text = pathlib.Path('uv.lock').read_text()
                    m = re.search(r'\[\[package\]\]\nname = \"ty\"\nversion = \"([^\"]+)\"', text)
                    print(m.group(1) if m else '')
                    ")
                    test -n "$RUFF" || { echo '::error::could not resolve ruff from uv.lock'; exit 1; }
                    test -n "$TY"   || { echo '::error::could not resolve ty from uv.lock'; exit 1; }
                    echo "ruff=$RUFF ty=$TY"
                    echo "ruff=$RUFF" >> "$GITHUB_OUTPUT"
                    echo "ty=$TY" >> "$GITHUB_OUTPUT"

            - name: Check Code Formatting
              run: uvx ruff@${{ steps.lint-tools.outputs.ruff }} format --check .

            - name: Lint Code
              run: uvx ruff@${{ steps.lint-tools.outputs.ruff }} check .

            - name: Type Check (ty)
              # Finding W in docs/audits/2026-07-12-technical-due-diligence.md:
              # type-check drift is now a hard CI gate.
              #
              # No project install: `ty check` resolves types from source and was
              # verified to pass with no environment at all. The `dev` group is
              # `include-group = "test"` plus ruff/ty, so `uv sync --group dev`
              # installed the entire test tree — torch, the ~2.7 GiB CUDA NVIDIA
              # stack, FastAPI, datasets — to run three static analysers.
              run: uvx ty@${{ steps.lint-tools.outputs.ty }} check src/llm/

            -   name: Verify examples compile
                run: |
                    for f in examples/*.py; do
                        python -m py_compile "$f"
                    done

    doctest:
        runs-on: ubuntu-latest
        needs: lint
        steps:
            -   name: Checkout repository
                uses: actions/checkout@v7
            -   name: Set up UV Environment
                uses: astral-sh/setup-uv@v10.3.0
                with:
                    enable-cache: true
                    cache-dependency-glob: uv.lock
            -   name: Verify lockfile is up to date
                run: uv lock --check
            -   name: Synchronize Dependencies
                # Doctests import the package, so the real dependency tree is
                # required here — but torch can still be the CPU build.
                uses: ./.github/actions/cpu-torch
            -   name: Run doctests
                run: uv run pytest --doctest-modules src/llm/ --no-header -q

    build-and-test:
        runs-on: ${{ matrix.os }}
        needs: lint
        strategy:
            matrix:
                os: [ubuntu-latest, macos-latest, windows-latest]
            fail-fast: false

        steps:
            -   name: Checkout repository
                uses: actions/checkout@v7

            -   name: Set up UV Environment
                uses: astral-sh/setup-uv@v10.3.0
                with:
                    enable-cache: true
                    # setup-uv's default cache key glob is
                    # ``**/*requirements*.txt``; this repo has no such file, so
                    # the key was constant and the cache could never be
                    # invalidated by a dependency change (and a stale key
                    # silently reuses an unrelated tree). ``uv.lock`` is the
                    # actual dependency fingerprint here.
                    cache-dependency-glob: uv.lock

            -   name: Verify lockfile is up to date
                # Checked against the COMMITTED lock, before the CPU re-lock
                # replaces it in this workspace. Keeps the "did someone forget
                # to commit uv.lock" gate honest.
                run: uv lock --check

            -   name: Synchronize Dependencies (CPU-only torch)
                uses: ./.github/actions/cpu-torch

            -   name: Build Project
                run: uv build

            -   name: Install just (command runner)
                uses: taiki-e/install-action@just

            # Platform split.
            #
            # The full CPU-clean suite runs on ONE platform (Ubuntu) — that is
            # where coverage is measured and where the gate is authoritative.
            # Windows and macOS additionally run only the subset whose failures
            # are plausibly platform-specific: path handling, filesystem
            # semantics, locale/encoding, subprocess invocation and the CLI
            # surface built on them.
            #
            # Dropping Windows/macOS entirely was considered and rejected: this
            # project's own history has multiple bugs that were invisible on
            # Linux and real elsewhere — a hardcoded ``/data/x.txt`` that became
            # ``\data\x.txt``, files opened with the locale default encoding
            # that broke on Windows (cp1252), and a numerical assertion that was
            # nonzero on Linux but rounded to zero on macOS/Windows. Those are
            # exactly what this subset is meant to keep catching, without paying
            # 3800 tests × 2 extra platforms on every push.
            -   name: Run Core CPU Tests with Coverage (ubuntu, full suite)
                if: matrix.os == 'ubuntu-latest'
                # Per-push gate: the fast CPU-clean core suite (excludes
                # GPU/heavy/e2e). GPU tests auto-skip on this GPU-less runner
                # (tests/conftest.py); the deep full-suite + coverage gate runs
                # on the weekly schedule via the `test-full` job.
                run: just test-cov-fast

            -   name: Run Platform-Sensitive Tests (windows/macos)
                if: matrix.os != 'ubuntu-latest'
                # Paths, filesystem, encoding, subprocess and CLI behaviour are
                # where platform differences actually surface. Excludes the
                # CPU-clean markers the full suite excludes, minus coverage:
                # coverage from a partial run would be misleading.
                run: >
                    uv run --frozen pytest
                    tests/cli tests/compat tests/data tests/export
                    tests/tokenization tests/evaluation tests/utils
                    -m "not heavy and not e2e and not gpu and not multi_gpu
                    and not full_cluster and not need_gpu"
                    -q --no-header

            -   name: Upload coverage report as artifact
                if: always() && matrix.os == 'ubuntu-latest'
                uses: actions/upload-artifact@v7
                with:
                    name: coverage-report-${{ matrix.os }} # Make artifact name unique per OS
                    path: |
                        coverage.xml

    test-full:
        # Deep gate: the FULL suite (all markers incl. heavy/e2e) + coverage.
        # Heavy/e2e are too slow for the per-push `build-and-test` core gate, so
        # this runs on the weekly schedule + manual dispatch, not on every push.
        # GPU tests auto-skip on this GPU-less runner (tests/conftest.py).
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        runs-on: ubuntu-latest
        needs: lint
        steps:
            -   name: Checkout repository
                uses: actions/checkout@v7

            -   name: Set up UV Environment
                uses: astral-sh/setup-uv@v10.3.0
                with:
                    enable-cache: true
                    cache-dependency-glob: uv.lock

            -   name: Verify lockfile is up to date
                run: uv lock --check

            -   name: Synchronize Dependencies (CPU-only torch)
                uses: ./.github/actions/cpu-torch

            -   name: Install just (command runner)
                uses: taiki-e/install-action@just

            -   name: Run Full Tests with Coverage
                run: just test-cov

            -   name: Upload coverage report as artifact
                if: always()
                uses: actions/upload-artifact@v7
                with:
                    name: coverage-report-full
                    path: |
                        coverage.xml
                        htmlcov/

    security:
        # Tier-1 audit item #09 / Finding X. Two gates:
        #   - pip-audit: scans the locked dependency set for known CVEs
        #   - bandit:   static security analysis of the source tree
        # pip-audit runs on PR, push, AND weekly cron (the cron catches
        # CVEs that are published after a dependency lands). bandit runs
        # on PR and push only.
        runs-on: ubuntu-latest
        needs: lint
        steps:
            -   name: Checkout repository
                uses: actions/checkout@v7

            -   name: Set up UV Environment
                uses: astral-sh/setup-uv@v10.3.0
                with:
                    enable-cache: true
                    cache-dependency-glob: uv.lock

            -   name: Verify lockfile is up to date
                run: uv lock --check

            # No environment install here on purpose. Both gates are independent
            # of the INSTALLED environment:
            #   - pip-audit reads the requirements file exported from the lock,
            #   - bandit is a pure static analyser over ``src/llm/``.
            # Installing the project just to run them pulled the full dependency
            # tree — including the CUDA torch stack, ~2.7 GiB of NVIDIA wheels
            # that a GPU-less runner can never use — and cost ~8 min of the job.
            # ``uvx`` fetches only the pinned tool, so the job now spends its
            # time auditing instead of downloading.

            -   name: Audit locked dependencies (pip-audit)
                # Strict: any known CVE in the lockfile fails the build.
                # Renovate also updates dependencies weekly, but pip-audit
                # adds a second layer for transitive vulnerabilities.
                # Versions are pinned in pyproject.toml [dependency-groups] security.
                #
                # Audit the exported lock set rather than the installed
                # environment: the local ``llm`` project is an editable
                # install that is not on PyPI, so environment scanning makes
                # pip-audit exit 1 with "Dependency not found on PyPI: llm"
                # on every run.
                run: |
                    uv export --frozen --no-hashes --no-emit-project -o /tmp/audit-requirements.txt
                    uvx --from 'pip-audit>=2.10.1' pip-audit -r /tmp/audit-requirements.txt --strict

            -   name: Static security analysis (bandit)
                # High+ severity findings fail the build. Lower severities
                # are reported as warnings.
                run: uvx --from 'bandit>=1.9.4' bandit -r src/llm/ --severity-level high

    docs:
        runs-on: ubuntu-latest
        needs: lint
        steps:
            -   name: Checkout repository
                uses: actions/checkout@v7

            -   name: Set up UV Environment
                uses: astral-sh/setup-uv@v10.3.0
                with:
                    enable-cache: true
                    cache-dependency-glob: uv.lock

            -   name: Verify lockfile is up to date
                run: uv lock --check

            -   name: Synchronize Documentation Dependencies
                # `--no-default-groups` skips the project's runtime deps
                # entirely, so no torch is installed here and there is nothing
                # for the CPU-torch swap to do. mkdocstrings does not import
                # `llm` either — it parses source with griffe.
                run: uv sync --frozen --no-default-groups --group docs

            -   name: Lint Markdown
                # Version pinned to match .pre-commit-config.yaml
                # (rvben/rumdl-pre-commit v0.2.52). Excludes live in
                # .rumdl.toml (CHANGELOG, docs/audits, ...).
                run: uvx rumdl@0.2.52 check .

            -   name: Validate mkdocs build (strict mode)
                run: uv run mkdocs build --strict

            -   name: Check for broken internal links
                run: |
                    uv run python -c "
                    import sys, yaml
                    from pathlib import Path
                    with open('mkdocs.yml') as f:
                        # mkdocs.yml uses a !!python/name tag for slugify,
                        # which safe_load rejects.
                        nav = yaml.unsafe_load(f)
                    missing = []
                    def check_nav(items):
                        if isinstance(items, dict):
                            for v in items.values():
                                check_nav(v)
                        elif isinstance(items, list):
                            for item in items:
                                check_nav(item)
                        elif isinstance(items, str) and items.endswith('.md'):
                            # Skip external links (e.g. CONTRIBUTING.md on GitHub);
                            # local nav paths are relative to docs_dir (docs/).
                            if items.startswith(('http://', 'https://')):
                                return
                            if not Path('docs', items).exists():
                                missing.append(items)
                    check_nav(nav.get('nav', []))
                    if missing:
                        print(f'Missing files: {missing}')
                        sys.exit(1)
                    print('All navigation files exist')
                    "
