[src]
# The repo's type-check gate is `ty check src/llm/` (CI + just ty); tests/,
# scripts/, notebooks/, examples/ etc. are intentionally NOT type-clean. Keep
# `uv check` (used by the astral ty-pre-commit hook) scoped to the same surface
# by excluding every non-src top-level directory.
exclude = [
    ".agents/**",
    "__pycache__/**",
    "tests/**",
    "scripts/**",
    "configs/**",
    "examples/**",
    "notebooks/**",
    "docs/**",
    "_learning/**",
    "data/**",
    "checkpoints/**",
    "logs/**",
    "results/**",
    "overrides/**",
    "site/**",
]

[rules]
incompatible-mutable-override = "ignore"
# ty flags overriding torch nn.Module.forward (typed Callable[..., Any]) as an
# incompatible mutable override; this is the standard, correct PyTorch subclassing
# pattern (45 sites across src/llm). Suppress the rule rather than annotate every
# forward.
#
# Renamed from `invalid-mutable-override` in ty 0.0.88..0.0.107; the old spelling is
# now a hard error ("Rule has been renamed"), not a silent no-op, so this file has
# to track ty's renames when the pin moves.
