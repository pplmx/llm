# FSDP (Fully-Sharded Data Parallel) example — mirrors
# docs/guides/distributed.md "FSDP quick start".
#
# Usage (one worker per visible GPU):
#   mkdir -p data
#   uv run python -c "print('\n'.join(f'this is sample line {i}' for i in range(200)))" > data/demo.txt
#   uv run llm train --task stream_lm --config-path configs/fsdp-pretrain.yaml
#
# Switches the whole run to FSDP via a single field; the knobs below are the
# documented defaults (conservative and safe to leave alone).

# This file carries the full runnable shape (model / training / data /
# optimization), not only the `distributed` block: a config holding just
# `distributed` parses fine and then dies at `data.dataset_path is required`,
# which the config-load test could not see.

model:
  hidden_size: 64
  num_heads: 4
  num_layers: 2
  vocab_size: 256
  max_seq_len: 64
  dropout: 0.0

training:
  epochs: 1
  batch_size: 4
  lr: 1.0e-3
  warmup_epochs: 0
  num_samples: 1000
  max_steps: 20

data:
  data_source: local
  tokenizer_type: simple
  dataset_path: data/demo.txt   # one record per line; see the usage block
  max_seq_len: 64
  steps_per_epoch: 5
  seen_hashes_path: null

optimization:
  use_amp: true          # FSDP runs comfortably in bf16
  gradient_checkpointing: false

checkpoint:
  checkpoint_dir: checkpoints_fsdp_pretrain
  save_interval: 1
  keep_last_n: 2
  save_best: false

distributed:
  parallel_strategy: fsdp
  # Optional FSDP knobs (defaults shown):
  fsdp_mixed_precision: bf16
  fsdp_auto_wrap_min_params: 10000000
  fsdp_cpu_offload: false
  # gpus_per_node: 2
