# Example configuration for LLM training
# Usage: llm-train --task lm --config-path configs/example.yaml

model:
  hidden_size: 512
  num_heads: 8
  num_layers: 4
  vocab_size: 50257
  max_seq_len: 512
  dropout: 0.1

training:
  epochs: 5
  batch_size: 32
  lr: 0.001
  gradient_accumulation_steps: 1
  max_steps: 1000

data:
  tokenizer_type: simple
  tokenizer_path: null  # Will use default character tokenizer
  dataset_path: data/dummy_corpus.txt
  max_seq_len: 512

optimization:
  use_amp: false         # CPU-safe; set true on CUDA
  use_compile: false
  gradient_checkpointing: false

checkpoint:
  checkpoint_dir: checkpoints
  save_interval: 1

distributed:
  backend: "gloo"        # CPU-safe; use nccl on multi-GPU
