# Tensor Parallelism example — mirrors docs/guides/distributed.md.
#
# Usage (one worker per visible GPU):
#   mkdir -p data
#   uv run python -c "print('\n'.join(f'this is sample line {i}' for i in range(200)))" > data/demo.txt
#   uv run llm train --task stream_lm --config-path configs/tp-pretrain.yaml
#
# tp_size=0 (default) = pure TP using the whole world; a tp_size < world_size
# enables TP + data-parallel 2D (see DistributedConfig.tp_size). Every
# partitioned axis (num_heads / num_kv_heads / vocab / intermediate width)
# must divide evenly by tp_size. The toy model above divides cleanly at 2/4.

# This file carries the full runnable shape (model / training / data /
# optimization), not only the `distributed` block: a config holding just
# `distributed` parses fine and then dies at `data.dataset_path is required`,
# which the config-load test could not see.

model:
  hidden_size: 64
  num_heads: 4
  num_layers: 2
  vocab_size: 256
  max_seq_len: 64
  dropout: 0.0

training:
  epochs: 1
  batch_size: 4
  lr: 1.0e-3
  warmup_epochs: 0
  num_samples: 1000
  max_steps: 20

data:
  data_source: local
  tokenizer_type: simple
  dataset_path: data/demo.txt   # one record per line; see the usage block
  max_seq_len: 64
  steps_per_epoch: 5
  seen_hashes_path: null

optimization:
  use_amp: false         # PP/TP are exercised in fp32 here; bf16 also works
  gradient_checkpointing: false

checkpoint:
  checkpoint_dir: checkpoints_tp_pretrain
  save_interval: 1
  keep_last_n: 2
  save_best: false

distributed:
  parallel_strategy: tp
  backend: nccl
  # tp_size: 0   # 0 = pure TP over the whole world
  # gpus_per_node: 2
